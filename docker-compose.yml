services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinelflow
      POSTGRES_PASSWORD: sentinelflow
      POSTGRES_DB: sentinelflow
    volumes:
      - sentinelflow_pgdata:/var/lib/postgresql/data
    ports:
      # Loopback only, so scripts/load_dataset.py on the host can seed it
      # (see README "Or with Docker").
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sentinelflow:sentinelflow@db:5432/sentinelflow
    ports:
      # Loopback only -- no auth in front of the API yet.
      - "127.0.0.1:8000:8000"

volumes:
  sentinelflow_pgdata:
