name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v

      - name: Verify raw data checksum and sample provenance, rebuild clean data
        run: python scripts/build_data.py

      - name: Run detection engine against the real labeled sample dataset
        run: python scripts/load_dataset.py --reset-db

      - name: Fail if the committed results drift from a fresh run
        run: git diff --exit-code -- docs/evaluation_report.json data/clean data/processed

      - name: Render charts from the fresh run
        run: python scripts/make_charts.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.11"

      - name: Install security tooling
        run: pip install bandit pip-audit

      - name: Bandit (static analysis for common security issues)
        working-directory: backend
        run: bandit -r app -q

      - name: pip-audit (known-vulnerable dependency scan)
        working-directory: backend
        run: pip-audit -r requirements.txt -r requirements-dev.txt

  container-scan:
    # pip-audit only sees requirements.txt. The image also carries Debian
    # packages and whatever the base image bundles, so scan the built image
    # too. Fails on HIGH/CRITICAL findings that already have a fix available;
    # unfixed OS CVEs are reported but don't block (nothing to upgrade to yet).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build -f backend/Dockerfile -t sentinelflow-api:ci .

      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --scanners vuln --no-progress \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            sentinelflow-api:ci
